# HTTPS + HTTP/2 front for Pentaract.
#
# Over plain HTTP the browser speaks HTTP/1.1 and opens at most 6
# connections per host, shared by every tab. A running upload holds its POST
# plus one progress stream per file, so a second tab could not even list a
# folder. HTTP/2 multiplexes every request over one connection.

# The access log keeps the path only: ?access_token= must never be written.
log_format pentaract '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent $request_time';

# Docker's embedded DNS: re-resolve the app when its container is recreated.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream pentaract {
    zone pentaract 64k;
    server pentaract:8000 resolve;
    keepalive 16;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Plain HTTP sent to the TLS port is redirected instead of failing.
    error_page 497 =301 https://$http_host$request_uri;

    access_log /var/log/nginx/access.log pentaract;

    # Transfers stream straight through: no size limit, no buffering to disk,
    # and timeouts long enough for multi-hour transfers and HLS seeks that
    # wait minutes on Telegram before the first byte.
    client_max_body_size     0;
    client_body_timeout      24h;
    send_timeout             24h;
    proxy_request_buffering  off;
    proxy_buffering          off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout       24h;
    proxy_send_timeout       24h;

    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ffmpeg's loopback source is never reachable from outside.
    location /api/internal/ {
        return 404;
    }

    location / {
        proxy_pass http://pentaract;
    }
}
